backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.45;
shadow-offset-x = -20;
shadow-offset-y = -12;
fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
shadow-exclude = [
  "override_redirect = true",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'menu'",
  "window_type = 'tooltip'"
];
