name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write  # to start the Website workflow, which publishes the update channel

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/roue/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: Build .deb
        run: packaging/deb/build.sh

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          echo "" >> release-notes.md
          {
            echo "**Install on Ubuntu 24.04+ or Debian 13+:** \`wget -qO- https://guilyx.github.io/roue/install.sh | sh\`"
            echo ""
            echo "Or download \`roue_${version}_all.deb\` and run \`sudo apt install ./roue_${version}_all.deb\`."
            echo "Already installed? Software Updater offers this version."
          } >> release-notes.md

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.deb
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish to the update channel
        env:
          GH_TOKEN: ${{ github.token }}
        # Releases made with the workflow token don't trigger other workflows,
        # but starting one by hand does.
        run: gh workflow run pages.yml --ref main
