name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "scripts/build_site.py"
      - "src/roue/presets/**"
      - "src/roue/data/icons/**"
      - "scripts/apt-repo.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install pyyaml markdown
      - name: Check generated sections are committed
        run: PYTHONPATH=src python scripts/build_site.py --check
      - name: Build the site
        run: PYTHONPATH=src python scripts/build_site.py --out _site
      - name: Publish the update channel (signed APT repository)
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::notice::No APT_SIGNING_KEY secret: skipping the update channel (docs/releasing.md)"
            exit 0
          fi
          mkdir -p debs
          for tag in $(gh release list --limit 5 --exclude-drafts --exclude-pre-releases \
                         --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern 'roue_*_all.deb' --dir debs --clobber
          done
          if ! ls debs/roue_*_all.deb >/dev/null 2>&1; then
            echo "::notice::No released .deb yet: skipping the update channel"
            exit 0
          fi
          command -v apt-ftparchive || sudo apt-get install -y apt-utils
          scripts/apt-repo.sh debs _site/apt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
